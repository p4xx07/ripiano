server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;
    # Real client address behind a reverse proxy: see real-ip.sh (RIPIANO_TRUSTED_PROXIES).
    # A too-large upload gets a JSON answer the app can show, not nginx's HTML page.
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"error": "File exceeds the upload limit"}';
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location = /mcp {
        proxy_pass http://mcp:8001/mcp;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 75s;
    }
    location /healthz {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /static/ {
        proxy_pass http://api:8000;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
