<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#183e32" />
    <script>
      let preference;
      try { preference = localStorage.getItem("ripiano.theme"); } catch {}
      const theme = preference === "amoled" || preference === "dark" || preference === "light"
        ? preference
        : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
      document.querySelector('meta[name="theme-color"]').content =
        theme === "amoled" ? "#000000" : theme === "dark" ? "#14251b" : "#173b30";
    </script>
    <meta name="description" content="A calmer home for your documents." />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Ripiano — your documents, in place</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
