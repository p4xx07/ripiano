[project]
name = "ripiano-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "celery[redis]>=5.6,<5.7",
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "gunicorn>=23,<24",
  "httpx>=0.28,<0.29",
  "mcp==2.3.0",
  "ocrmypdf>=17.12,<18",
  "pillow>=11,<13",
  "psycopg[binary]>=3.3,<3.4",
  "pypdf>=6,<7",
  "segno>=1.6,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ripiano.settings"
python_files = ["test_*.py"]
