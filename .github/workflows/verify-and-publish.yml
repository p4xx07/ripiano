name: Verify and publish

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.9.26"
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
        working-directory: services/api
      - run: uv run pytest -q
        working-directory: services/api
        env:
          RIPIANO_DEBUG: "1"
      - run: uv run python manage.py check
        working-directory: services/api
        env:
          RIPIANO_DEBUG: "1"
      - run: uv run python manage.py makemigrations --check --dry-run
        working-directory: services/api
        env:
          RIPIANO_DEBUG: "1"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  local-classifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.9.26"
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
        working-directory: agents/local_classifier
      - run: uv run python -m unittest discover -v
        working-directory: agents/local_classifier

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Portainer stack
        env:
          RIPIANO_API_IMAGE: ghcr.io/p4xx07/ripiano-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RIPIANO_WEB_IMAGE: ghcr.io/p4xx07/ripiano-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: docker compose -f deploy/compose.portainer.yaml --env-file .env.example config -q
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./services/api
          platforms: linux/amd64
          push: false
      - uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          platforms: linux/amd64
          push: false

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [api, web, local-classifier, stack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        id: api-image
        uses: docker/build-push-action@v7
        with:
          context: ./services/api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ripiano-api:${{ github.ref_name }}
          provenance: true
      - name: Build and publish web image
        id: web-image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ripiano-web:${{ github.ref_name }}
          provenance: true
      - name: Record immutable image references
        run: |
          echo 'Set these two image references in Portainer:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'RIPIANO_API_IMAGE=ghcr.io/${{ github.repository_owner }}/ripiano-api@${{ steps.api-image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'RIPIANO_WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/ripiano-web@${{ steps.web-image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
